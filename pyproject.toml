[project]
name = "leilao"
version = "0.1.0"
description = "Motor de simulacao de mecanismos de leilao por creditos para alocacao de vagas universitarias (TCC)"
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.8",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
